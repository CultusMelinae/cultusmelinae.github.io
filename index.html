<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="keywords" content="Cultus, Melinae, Cultus Melinae, Cultus Melinae Community, Cultus Melinae Band, Musica Melinae">
<style>
  #header {
  color: #aa0000;
  text-align: center;
  font-size: 50px;
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
}
#logolarge {
height:35dvw;
width:75dvw;
text-align:center;
display:block;
margin:auto;
}
body {
margin: 0;
background-color: #000000;
}
.divider {
margin-left:auto;
margin-right:auto;
margin-top:4dvw;
margin-bottom:4dvw;
display:block;
height: 5,625dvw;
width:90dvw;
}
.text {
  width: 85dvw;
  margin: 0 auto;
  color: #aa0000;
  font-size: clamp(1rem, 2.5vw, 2rem);
  line-height: 1.2;
}
figcaption.text {
  width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
  margin: 0 auto;
  color: #bf0000;
  font-size: clamp(0.75rem, 1.25vw, 1.5rem);
  line-height: 1.2;
}
#sec2 {
justify-content: space-evenly;
width:100%;
display:flex;
}
.imagesec1 {
height: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
float:left;
margin-left: 7.5dvw;
}
.imagesec2 {
height: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
border-radius: 1.5dvw;
}
figure {
margin: 0;
background-color: #550000;
padding: 2dvw;
border-radius: 1dvw;
outline-color: #400000;
outline-width: 1dvw;
outline-style: solid;
}
figure:hover {
transform: scale(1.1);
}
a {color: #00aa00;
text-decoration: none;}
a:hover {
    color: #00ff00;text-decoration: underline;
}
.grid-container {
  display: grid;
  grid-template-columns: calc(85dvw*0.75), calc(85dvw*0.25);
  gap: 1.5dvw 1.5dvw;
  width: 85%;
  margin: 0 auto;
}

.grid-item {
  border-radius: 0.5dvw;
  outline-color: #400000;
  outline-width: 0.5dvw;
  outline-style: solid;
  display: flex;
  color: #bf0000;
  background-color: #550000;
}

.item-1 {
  grid-column: 1 / 2;
  grid-row: 1 / 2;
}

.item-2 {
  grid-column: 1 / 2;
  grid-row: 2 / 3;
}

.item-3 {
  grid-column: 2 / 3;
  grid-row: 1 / 3;
}
.image1sec3 {
height: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
border-radius: 1.5dvw;
float: left;
margin: 1dvw;
}
.image2sec3 {
height: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
border-radius: 1.5dvw;
float: right;
margin: 1dvw;
}
.image3sec3 {
height: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
border-radius: 1.5dvw;
float: none;
margin: 1dvw;
}
</style>
</head>
<body>
<div id="header"></div>
<img id="logolarge" src="Images/redonblacklogo.png">
<img class="divider" src="Images/divider.png">
<img class="imagesec1" src="Images/M.png">
<div class="text">
  Welcome to Cultus Melinae! Cultus Melinae is a friendly community of around 50 members. Cultus Melinae is a place where you can contribute to the "cult", make friends, or just hang out with the members.
</div>
<img class="divider" src="../Images/divider.png">
<div id="sec2">
  <figure>
    <img class="imagesec2" src="Images/Pages.png">
    <figcaption class="text">If you want to know more about us. Consider reading our documents.</figcaption>
  </figure>
  <figure>
    <img class="imagesec2" src="Images/Eye.png">
    <figcaption class="text">Intrested in Cultus Melinae and want to join? <a href="mailto:cultusmelinae@gmail.com">Send us an email!</a></figcaption>
  </figure>
  <figure>
    <img class="imagesec2" src="Images/Guitar.png">
    <figcaption class="text">We have a band called Musica Melinae. If you want to be part of it, fill in this form.</figcaption>
  </figure>
</div>
<img class="divider" src="../Images/divider.png">
<div class="grid-container">
  <div class="grid-item item-1">
    <img class="image1sec3" src="Images/Guitar.png">
  </div>
  <div class="grid-item item-2">
    <img class="image2sec3" src="Images/Guitar.png">
  </div>
  <div class="grid-item item-3">
    <img class="image3sec3" src="Images/Guitar.png">
  </div>
</div>
</body></html>

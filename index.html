<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
#header {
  color: #aa0000;
  text-align: center;
  font-size: 50px;
  height: 50px;
  display: flex;
  justify-content: center;
  align-items: center;
}
#logolarge {
height:35dvw;
width:75dvw;
text-align:center;
display:block;
margin:auto;
}
body {
margin: 0;
background-color: #000000;
height: 200dvh;
}
.divider {
margin-left:auto;
margin-right:auto;
margin-top:2dvw;
margin-bottom:2dvw;
display:block;
height: 5.625dvw;
width:90dvw;
}
.text {
  width: 85dvw;
  margin: 0 auto;
  color: #aa0000;
  font-size: clamp(1rem, 2.5vw, 2rem);
  line-height: 1.2;
}
figcaption.text {
  width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
  margin: 0 auto;
  color: #aa0000;
  font-size: clamp(0.75rem, 1.25vw, 1.5rem);
  line-height: 1.2;
}
#sec2 {
justify-content: space-evenly;
width:100%;
display:flex;
}
.imagesec1 {
height: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
float:left;
margin-left: 7.5dvw;
}
.imagesec2 {
height: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
width: clamp(10dvw, calc((25dvw + 25dvh) / 2), 25dvw);
}
figure {
margin: 0;
}
a {color: #00aa00;
text-decoration: none;}
a:hover {color: #00ff00;text-decoration: underline;}
</style>
</head>
<body>
<div id="header"></div>
<img id="logolarge" src="Images/redonblacklogo.png">
<img class="divider" src="Images/divider.png">
<img class="imagesec1" src="Images/M.png">
<div class="text">
  Welcome to Cultus Melinae! Cultus Melinae is a friendly community of around 50 members. Cultus Melinae is a place where you can contribute to the "cult", make friends, or just hang out with the members.
</div>
<img class="divider" src="Images/divider.png">
<div id="sec2">
  <figure>
    <img class="imagesec2" src="Images/Pages.png">
    <figcaption class="text">If you want to know more about Cultus Melinae.</figcaption>
  </figure>
  <figure>
    <img class="imagesec2" src="Images/Eye.png">
    <figcaption class="text">Intrested in Cultus Melinae and wanting to join? <a href="mailto:cultusmelinae@gmail.com">Send us an email!</a>Or email us at cultusmelinae@gmail.com.</figcaption>
  </figure>
  <figure>
    <img class="imagesec2" src="Images/Guitar.png">
    <figcaption class="text">Lorem ipsum dolor amet. Lorem Ipsum Dolor Amet.</figcaption>
  </figure>
</div>
</body></html>
